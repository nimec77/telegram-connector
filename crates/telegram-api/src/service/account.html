<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram account</title>
<style>
body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui; }
form { display: grid; gap: .75rem; margin: 1rem 0; }
input, button, select { font: inherit; }
label { display: block; }
</style>
<h1>Telegram account</h1>
<p id="status" role="status"></p>
<a id="signin" href="/auth/start">Sign in</a>
<main hidden>
<form id="link">
<label><span id="prompt">Phone number</span> <input id="secret" required type="tel" autocomplete="tel"></label>
<button>Continue</button>
</form>
<button type="button" id="unlink">Unlink Telegram account</button>
<h2>Joined channels</h2>
<button id="list-channels" type="button">Load joined channels</button>
<ul id="joined"></ul>
<button id="previous-channels" type="button" hidden>Previous channels</button>
<button id="next-channels" type="button" hidden>Next channels</button>
<h2>Client permissions</h2>
<form id="grant">
<label>Registered client ID <input id="client" required></label>
<button id="load" type="button">Load permissions</button>
<label>Read access <select id="access"><option value="none">None</option><option value="channels">Selected channels</option><option value="all_joined">All eligible joined channels (direct clients)</option></select></label>
<label>Channel IDs, separated by commas <input id="channels"></label>
<label><input type="checkbox" id="send"> Allow sending to writable Telegram peers</label>
<button id="save" disabled>Save permissions</button>
</form>
</main>
<script>
const byId = id => document.getElementById(id);
const status = byId('status');
let csrf, phase = 'phone', challenge, grantDraft;
let joinedOffset = 0, joinedRequest;
const joinedLimit = 100;

function clearGrant() {
  grantDraft = undefined;
  byId('save').disabled = true;
}

function clearJoinedChannels() {
  joinedRequest = undefined;
  joinedOffset = 0;
  byId('joined').replaceChildren();
  byId('previous-channels').hidden = true;
  byId('next-channels').hidden = true;
}
async function api(path, method = 'GET', body) {
  const headers = method === 'GET' ? {} : {'X-CSRF-Token': csrf};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const response = await fetch(path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)});
  if (!response.ok) throw new Error((await response.json()).error.code);
  return response.json();
}
async function account() {
  const data = await api('/v1/account');
  status.textContent = data.state.replaceAll('_', ' ');
}
async function action(work) {
  try { await work(); } catch (error) { status.textContent = error.message.replaceAll('_', ' '); }
}
function updateStep() {
  byId('prompt').textContent = {phone: 'Phone number', code: 'Telegram login code', password: 'Telegram two-factor password'}[phase];
  byId('secret').type = {phone: 'tel', code: 'text', password: 'password'}[phase];
  byId('secret').autocomplete = {phone: 'tel', code: 'one-time-code', password: 'current-password'}[phase];
}
byId('link').onsubmit = event => {
  event.preventDefault();
  action(async () => {
    const value = byId('secret').value;
    byId('secret').value = '';
    const route = phase === 'phone' ? '/v1/account/link' : '/v1/account/link/' + encodeURIComponent(challenge) + '/' + phase;
    const result = await api(route, 'POST', {[phase === 'phone' ? 'phone_number' : phase]: value});
    phase = result.step === 'linked' ? 'phone' : result.step;
    challenge = result.challenge;
    if (result.step === 'linked') { clearGrant(); clearJoinedChannels(); }
    updateStep();
    await account();
  });
};
byId('unlink').onclick = () => action(async () => {
  if (!confirm('Unlink this Telegram account?')) return;
  clearGrant();
  clearJoinedChannels();
  await api('/v1/account/link', 'DELETE');
  phase = 'phone';
  challenge = undefined;
  updateStep();
  await account();
});
async function loadJoinedChannels(offset) {
  const request = Symbol();
  joinedRequest = request;
  const previous = byId('previous-channels');
  const next = byId('next-channels');
  previous.disabled = true;
  next.disabled = true;
  try {
    const data = await api('/v1/account/channels?offset=' + offset + '&limit=' + joinedLimit);
    if (joinedRequest !== request) return;
    joinedOffset = offset;
    const items = data.channels.map(channel => {
      const item = document.createElement('li');
      item.textContent = channel.name + ' (' + channel.channel_id + ')';
      return item;
    });
    byId('joined').replaceChildren(...items);
    previous.hidden = offset === 0;
    next.hidden = offset + joinedLimit >= data.total;
  } finally {
    if (joinedRequest === request) {
      previous.disabled = false;
      next.disabled = false;
    }
  }
}

byId('list-channels').onclick = () => action(() => loadJoinedChannels(0));
byId('previous-channels').onclick = () => action(() => loadJoinedChannels(Math.max(0, joinedOffset - joinedLimit)));
byId('next-channels').onclick = () => action(() => loadJoinedChannels(joinedOffset + joinedLimit));

byId('client').oninput = clearGrant;
byId('load').onclick = () => action(async () => {
  const draft = { client: byId('client').value, snapshot: null };
  grantDraft = draft;
  byId('save').disabled = true;
  try {
    const snapshot = await api('/v1/account/grants/' + encodeURIComponent(draft.client));
    if (grantDraft !== draft || byId('client').value !== draft.client) return;
    draft.snapshot = snapshot;
    byId('access').value = snapshot.read.kind;
    byId('channels').value = (snapshot.read.channel_ids ?? []).join(', ');
    byId('send').checked = snapshot.send_enabled;
    byId('save').disabled = false;
  } catch (error) {
    if (grantDraft !== draft) return;
    clearGrant();
    throw error;
  }
});
byId('grant').onsubmit = event => {
  event.preventDefault();
  return action(async () => {
    const draft = grantDraft;
    if (!draft?.snapshot || draft.client !== byId('client').value || byId('save').disabled) return;
    byId('save').disabled = true;
    const read = { kind: byId('access').value };
    if (read.kind === 'channels') read.channel_ids = byId('channels').value.split(',').map(id => id.trim()).filter(Boolean);
    try {
      const snapshot = await api('/v1/account/grants/' + encodeURIComponent(draft.client), 'PUT', {
        generation: draft.snapshot.generation, expected_revision: draft.snapshot.revision,
        read, send_enabled: byId('send').checked
      });
      if (grantDraft !== draft || byId('client').value !== draft.client) return;
      draft.snapshot = snapshot;
      byId('save').disabled = false;
      status.textContent = 'Permissions saved';
    } catch (error) {
      if (grantDraft !== draft) return;
      clearGrant();
      throw error;
    }
  });
};
action(async () => {
  const session = await api('/v1/session');
  if (session.kind !== 'browser_owner' || !session.scopes.includes('telegram.link')) return;
  csrf = session.csrf_token;
  byId('signin').hidden = true;
  document.querySelector('main').hidden = false;
  await account();
});
</script>
