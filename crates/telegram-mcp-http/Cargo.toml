[package]
name = "telegram-mcp-http"
version = "0.26.1"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls", "query"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = "1.0.154"
telegram-api = { path = "../telegram-api", version = "0.26.1", default-features = false, features = ["identity", "schemas"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
telegram-api = { path = "../telegram-api", default-features = false, features = ["test-support"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "query"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11.1"
tempfile.workspace = true

[lints]
workspace = true
