# Telegram MCP Connector Configuration
# Platform config path: see README.md (or use --config / TELEGRAM_MCP_CONFIG).
#
# SECURITY: Sensitive credentials (api_hash, phone_number) are protected
# using the `secrecy` crate and will not be exposed in debug logs or error messages.

[telegram]
# Always required: Telegram API ID from https://my.telegram.org
api_id = 12345678

# Required for --setup: API hash (SENSITIVE - protected by secrecy crate)
# Can be omitted when serving with an authenticated session.
# Supports environment variable expansion with ${VAR_NAME} syntax
api_hash = "${TELEGRAM_API_HASH}"

# Required for --setup: Telegram phone number (SENSITIVE - protected by secrecy crate)
# Can be omitted when serving with an authenticated session.
# Can be plain text or environment variable
phone_number = "+1234567890"

# Optional: Session file location
# Default: session.bin in the platform config directory (not beside a custom --config).
# Paths are used as written; replace this example with an absolute path.
# Tilde (~) is not expanded; environment-variable expansion is supported.
# Note: The session file path itself is not sensitive, but the file contents are.
# session_file = "/absolute/path/to/session.bin"

# Optional: hard cap (bytes) on a single media download (get_message_media).
# Transfers larger than this are rejected before and during streaming.
# Default: 20971520 (20 MiB). Pairs with [rate_limiting] media_download_cost.
# max_download_bytes = 20971520
# Inputs must fit the fixed 80 MiB process-wide raw allowance (maximum cap 83886080).
# Four raw buffers and two image workers are shared by concurrent MCP calls.
# Source decoding rejects sides >8192, >8388608 pixels or a >64 MiB decoded allowance.
# These bounds are also reported by check_mcp_status; codec/RSS overhead is separate.

# [telegram.timeouts]
# Optional: per-call-type wall-clock budgets (seconds) for grammers network calls.
# Hitting a budget cancels the in-flight call and returns Error::Timeout to the
# MCP client instead of hanging indefinitely. All fields must be > 0.
# resolve_secs = 30   # resolve_username + iter_dialogs lookups
# history_secs = 60   # iter_messages / get_messages_by_id
# search_secs  = 120  # search_messages (single-channel and global)
# download_secs = 120 # media downloads (get_message_media / get_messages_media_batch)

[server]
# Versioned structured JSON + matching text fallback (default); use "legacy" temporarily
# for consumers parsing the historical text/image shapes. Independent of MCP version.
output_format = "json_v1"
# Absolute drain deadline for accepted requests AND pending stdout writes.
# 0 cancels immediately once EOF/signal is observed; maximum 3600 seconds.
# Bootstrap response write-stall limit is max(1 second, this budget), including
# when a saturated input buffer hides EOF. The 1s floor permits normal startup.
shutdown_timeout_seconds = 5
# Incoming NDJSON frame bytes including newline; independent of image output size.
# Range: 1..=16777216.
max_request_bytes = 1048576
# Active requests including responses waiting for stdout. Range: 1..=1024.
max_in_flight_requests = 16

# Optional processed-JPEG cache and explicit local export. Disabled by default.
# See docs/media-artifacts.md for private-root ownership, stale locks and DeepSeek setup.
[media_artifacts]
enabled = false
file_export_enabled = false
# Dedicated empty absolute root; default is media-artifacts under the platform config dir.
# root = "/absolute/private/path/media-artifacts"
ttl_seconds = 600           # 1..=3600; maximum lifetime, quota eviction may be earlier
max_entries = 100           # 1..=1000, per process
max_total_bytes = 268435456 # 1..=1073741824, per process; 20 MiB per JPEG

[search]
# Wall-clock budget for a search's accumulation loop. On expiry the search
# returns the results gathered so far with "timed_out": true and
# "partial": true in query_metadata — never an error, because partial
# results beat a failed workflow. Must be > 0 and <= 3600.
#
# Keep this BELOW [telegram.timeouts] search_secs (default 120), or the hard
# timeout fires first and the call fails instead of degrading. The two are not
# cross-validated: each table is independently overridable, and a hard coupling
# would surprise anyone tuning one without the other.
#
# CONSERVATIVE STARTING POINT, NOT A MEASURED VALUE — chosen to sit below
# typical MCP client timeouts. Tune against your own traffic.
# deadline_seconds = 20                    # Default: 20 (max: 3600)

[rate_limiting]
# Optional: Token bucket configuration.
#
# These are CONSERVATIVE ESTIMATES, not values calibrated against Telegram's
# real flood thresholds. Tune them against your own traffic.
# max_tokens = 60                          # Default: 60 (burst capacity)
# refill_rate = 2.0                        # Default: 2.0 tokens/second
# media_download_cost = 3                  # Default: 3 tokens per image
# transcription_cost = 5                   # Default: 5 (Telegram's weekly quota is scarce)

# Costs are validated at startup: a cost above max_tokens is rejected, since
# such a call could never be served even from a full bucket.

[limits]
# Byte cap on a serialized message-stream response. When a page would exceed
# it, trailing messages are dropped and has_more/next_cursor are set.
# response_byte_budget = 40000

# Cap on the TOTAL image payload of one get_messages_media_batch call, counted
# in bytes of base64 as sent to the client (base64 is 4/3 the JPEG size, and
# base64 is what consumes context). Images are downscaled progressively to fit;
# ids that still do not fit are reported in `failed` with reason
# payload_cap_reached.
#
# This is a CONSERVATIVE ESTIMATE, not a measured limit.
# media_batch_max_total_bytes = 8388608    # Default: 8388608 (8 MiB)

# [transcription]
# Optional: bounds for the transcribe_voice_message `timeout_seconds` request param.
# default_timeout_seconds = 30             # Default: 30 (applied when the request omits it)
# max_timeout_seconds = 120                # Default: 120 (request value is clamped to this)

[logging]
# Optional: Logging configuration
# level = "info"                           # Default: "info" (trace, debug, info, warn, error)
# format = "compact"                       # Default: "compact" (compact, pretty, json)
#
# File logging (JSON format, daily rotation)
# file_enabled = true                      # Default: true
# file_path = "/absolute/path/to/logs"      # Default: logs in the platform config directory
# max_log_days = 7                         # Default: 7 days (old logs cleaned on startup)

# Transport observability. All fields optional.
# slow_write_threshold_ms: WARN when a stdout write+flush exceeds this (0 = warn on every write).
# response_buffer_size: responses kept for the get_last_responses recovery tool (0 = disabled).
# max_buffered_payload_bytes: responses larger than this are stubbed in the
#   get_last_responses buffer (image payloads replaced with {omitted, ...} stubs).
# [observability]
# slow_write_threshold_ms = 500
# response_buffer_size = 10
# max_buffered_payload_bytes = 262144      # Default: 262144 (256 KiB)
