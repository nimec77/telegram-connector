[package]
name = "telegram-connector"
version = "0.5.2"
edition = "2024"

[lib]
name = "telegram_connector"
path = "src/lib.rs"

[[bin]]
name = "telegram-mcp"
path = "src/main.rs"

[dependencies]
# MCP
rmcp = { version = "1.7.0", features = ["server"] }

# Telegram
grammers-client = { git = "https://github.com/Lonami/grammers", branch = "master" }
grammers-session = { git = "https://github.com/Lonami/grammers", branch = "master" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", branch = "master" }

# Async
tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1"

# Interactive prompts
dialoguer = "0.12.0"

# CLI parsing
clap = { version = "4.6.1", features = ["derive"] }

# Config & Serialization
toml = "1.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
schemars = { version = "1.2.1", features = ["derive"] }
directories = "6.0.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2.5"

# Errors
anyhow = "1.0.102"
thiserror = "2.0.18"

# Utilities
chrono = { version = "0.4.44", features = ["serde"] }
dashmap = "6.2.1"

# Security
secrecy = { version = "0.10", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4.5"
tempfile = "3.27.0"
proptest = "1.11.0"
mockall = "0.14.0"
filetime = "0.2.29"
