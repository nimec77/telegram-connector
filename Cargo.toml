[workspace]
members = ["crates/telegram-core", "crates/telegram-api"]
resolver = "3"

[package]
name = "telegram-connector"
version = "0.26.1"
edition = "2024"

[lib]
name = "telegram_connector"
path = "src/lib.rs"

[[bin]]
name = "telegram-mcp"
path = "src/main.rs"

[[example]]
name = "safe_send"
path = "examples/safe_send/main.rs"
test = true

[dependencies]
telegram-core = { path = "crates/telegram-core", version = "0.26.1" }
# MCP
rmcp = { version = "3.11.0", features = ["server"] }

# Async
# Explicit feature list rather than `full`: "net" and "fs" are unused here, and
# `full` also pulls "parking_lot". Each entry below backs a real call site —
# io-std: `tokio::io::{stdin, stdout}` for the MCP stdio transport;
# io-util: transport extension traits and bounded outgoing AsyncRead streams;
# macros: `#[tokio::main]` / `#[tokio::test]` and `select!`;
# process: `tokio::process::Command` (open_message_in_telegram);
# rt-multi-thread: the default `#[tokio::main]` flavor, `spawn`,
#   `spawn_blocking`, and `Runtime::new` in tests;
# signal: SIGINT/SIGTERM shutdown handling;
# sync: `oneshot`, `RwLock`;
# time: timeout budgets, `sleep`, `Instant`.
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
async-trait.workspace = true
futures.workspace = true

# Interactive prompts
dialoguer = "0.12.0"

# CLI parsing
clap = { version = "4.6.8", features = ["derive"] }

# Config & Serialization
toml = "1.2.1"
serde.workspace = true
serde_json = "1.0.154"
schemars.workspace = true
directories.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2.5"

# Errors
anyhow.workspace = true
thiserror.workspace = true

# Utilities
jiff.workspace = true

# Security
getrandom.workspace = true
secrecy.workspace = true

# Media processing
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23.1"

[dev-dependencies]
grammers-client.workspace = true
grammers-session.workspace = true
grammers-mtsender.workspace = true

telegram-core = { path = "crates/telegram-core", version = "0.26.1", features = ["test-support"] }
# Exercise the modern binding over loopback without enabling HTTP for production stdio.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.11.0", features = ["transport-streamable-http-server"] }
# PNG codec for tests: create_test_jpeg & non-JPEG re-encode test write_to PNG
image = { version = "0.25", default-features = false, features = ["png"] }
# `test-util` enables the pausable test clock; `net` enables the loopback HTTP fixture.
# Neither feature needs to be requested on the production connector dependency.
tokio = { workspace = true, features = ["test-util", "net"] }
tempfile.workspace = true
proptest.workspace = true
mockall.workspace = true
# Validate real advertised 2020-12 output unions offline; no HTTP/file resolver defaults.
jsonschema = { version = "0.61.2", default-features = false }

# Targeted manual enforcement; keep advisory pedantic/restriction groups opt-in.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
wildcard_imports = "warn"
missing_errors_doc = "warn"
return_self_not_must_use = "warn"

[lints]
workspace = true

[workspace.dependencies]
# Telegram — upstream moved to Codeberg in Feb 2026; the GitHub repo is a
# stale mirror slated for deletion. Do not point these back at github.com.
# Pinned by rev, not branch: Codeberg master is active and ships breaking
# changes; bump the rev deliberately (all three together) and expect to
# absorb API churn when you do.
grammers-client = { git = "https://codeberg.org/Lonami/grammers", rev = "e61cf8585e1e9969ab81eda9fb4725a1500e2d86" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers", rev = "e61cf8585e1e9969ab81eda9fb4725a1500e2d86" }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers", rev = "e61cf8585e1e9969ab81eda9fb4725a1500e2d86" }

jiff = { version = "1.0.1", default-features = false, features = ["std"] }
schemars = { version = "1.2.3", features = ["derive"] }
anyhow = "1.0.104"
async-trait = "0.1"
mockall = "0.15.0"
proptest = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = "1.54.1"
directories = "6.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1.44"
tempfile = "3.27.0"
