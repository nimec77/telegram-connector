[package]
name = "telegram-connector"
version = "0.25.0"
edition = "2024"

[lib]
name = "telegram_connector"
path = "src/lib.rs"

[[bin]]
name = "telegram-mcp"
path = "src/main.rs"

[dependencies]
# MCP
rmcp = { version = "3.8", features = ["server"] }

# Telegram — upstream moved to Codeberg in Feb 2026; the GitHub repo is a
# stale mirror slated for deletion. Do not point these back at github.com.
# Pinned by rev, not branch: Codeberg master is active and ships breaking
# changes; bump the rev deliberately (all three together) and expect to
# absorb API churn when you do.
grammers-client = { git = "https://codeberg.org/Lonami/grammers", rev = "1e31e73cd9797790905bbea82cd75adcbe6f1242" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers", rev = "1e31e73cd9797790905bbea82cd75adcbe6f1242" }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers", rev = "1e31e73cd9797790905bbea82cd75adcbe6f1242" }

# Async
# Explicit feature list rather than `full`: "net" and "fs" are unused here, and
# `full` also pulls "parking_lot". Each entry below backs a real call site —
# io-std: `tokio::io::{stdin, stdout}` for the MCP stdio transport;
# macros: `#[tokio::main]` / `#[tokio::test]` and `select!`;
# process: `tokio::process::Command` (open_message_in_telegram);
# rt-multi-thread: the default `#[tokio::main]` flavor, `spawn`,
#   `spawn_blocking`, and `Runtime::new` in tests;
# signal: SIGINT/SIGTERM shutdown handling;
# sync: `oneshot`, `RwLock`;
# time: timeout budgets, `sleep`, `Instant`.
tokio = { version = "1.54.1", features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
async-trait = "0.1"
futures = "0.3.34"

# Interactive prompts
dialoguer = "0.12.0"

# CLI parsing
clap = { version = "4.6.7", features = ["derive"] }

# Config & Serialization
toml = "1.1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2.3", features = ["derive"] }
directories = "6.0.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2.5"

# Errors
anyhow = "1.0.104"
thiserror = "2.0.21"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }

# Security
getrandom = "0.4.3"
secrecy = { version = "0.10", features = ["serde"] }

# Media processing
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23.1"

[dev-dependencies]
# Recreate the previous SQLite session schema offline; same storage line/features as grammers.
libsql = { version = "0.10.0", default-features = false, features = ["core"] }
# PNG codec for tests: create_test_jpeg & non-JPEG re-encode test write_to PNG
image = { version = "0.25", default-features = false, features = ["png"] }
# `test-util` enables the pausable clock (`start_paused`, `time::advance`) used by
# the timeout/transcription tests. It is intentionally excluded from `full`, so it
# must be requested explicitly here (dev-only, never compiled into release builds).
tokio = { version = "1.54.1", features = ["test-util"] }
tempfile = "3.27.0"
proptest = "1.12.0"
mockall = "0.15.0"
filetime = "0.2.29"
# Validate real advertised 2020-12 output unions offline; no HTTP/file resolver defaults.
jsonschema = { version = "0.60.2", default-features = false }

# Targeted manual enforcement; keep advisory pedantic/restriction groups opt-in.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
wildcard_imports = "warn"
missing_errors_doc = "warn"
return_self_not_must_use = "warn"
