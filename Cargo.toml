[package]
name = "telegram-connector"
version = "0.22.2"
edition = "2024"

[lib]
name = "telegram_connector"
path = "src/lib.rs"

[[bin]]
name = "telegram-mcp"
path = "src/main.rs"

[dependencies]
# MCP
rmcp = { version = "3.1", features = ["server"] }

# Telegram — upstream moved to Codeberg in Feb 2026; the GitHub repo is a
# stale mirror slated for deletion. Do not point these back at github.com.
# Pinned by rev, not branch: Codeberg master is active and ships breaking
# changes; bump the rev deliberately (all three together) and expect to
# absorb API churn when you do.
grammers-client = { git = "https://codeberg.org/Lonami/grammers", rev = "9fef0bae1e59b6138ae7777c783983934a80e129" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers", rev = "9fef0bae1e59b6138ae7777c783983934a80e129" }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers", rev = "9fef0bae1e59b6138ae7777c783983934a80e129" }

# Async
tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Interactive prompts
dialoguer = "0.12.0"

# CLI parsing
clap = { version = "4.6.1", features = ["derive"] }

# Config & Serialization
toml = "1.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
schemars = { version = "1.2.1", features = ["derive"] }
directories = "6.0.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2.5"

# Errors
anyhow = "1.0.102"
thiserror = "2.0.18"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }

# Security
secrecy = { version = "0.10", features = ["serde"] }

# Media processing
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[dev-dependencies]
# PNG codec for tests: create_test_jpeg & non-JPEG re-encode test write_to PNG
image = { version = "0.25", default-features = false, features = ["png"] }
# `test-util` enables the pausable clock (`start_paused`, `time::advance`) used by
# the timeout/transcription tests. It is intentionally excluded from `full`, so it
# must be requested explicitly here (dev-only, never compiled into release builds).
tokio = { version = "1.52.3", features = ["test-util"] }
tempfile = "3.27.0"
proptest = "1.11.0"
mockall = "0.14.0"
filetime = "0.2.29"
